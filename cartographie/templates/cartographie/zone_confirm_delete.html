<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Supprimer zone</title>
<style>:root{--bg:#1a1b2e;--bg-card:#232541;--border:#3d4060;--text:#e8e9f3;--text-sec:#a0a3c2;--red:#f87171}*{font-family:Arial,sans-serif;margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:40px;max-width:450px;text-align:center}h2{margin-bottom:10px}p{color:var(--text-sec);margin-bottom:25px}.actions{display:flex;gap:12px;justify-content:center}.actions a,.actions button{text-decoration:none;padding:10px 24px;border-radius:8px;font-weight:600;font-size:0.95rem;border:none;cursor:pointer}.btn-conf{background:var(--red);color:#0a0a1a}.btn-ann{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}</style>{% include 'cartographie/_pwa_head.html' %}
</head>
<body><div class="card"><h2 data-i18n="confirmer_suppression">Confirmer la suppression</h2><p><span data-i18n="supprimer_zone">Supprimer la zone</span> « {{ zone.nom }} » ?</p><form method="POST" class="actions">{% csrf_token %}<button type="submit" class="btn-conf" data-i18n="oui_supprimer">Oui, supprimer</button><a href="{% url 'zone_list' %}" class="btn-ann" data-i18n="annuler">Annuler</a></form></div>{% include 'cartographie/_i18n.html' %}{% include 'cartographie/_pwa_body.html' %}
</body></html>
